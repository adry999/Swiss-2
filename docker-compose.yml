# Local development: database only. Run the app with `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swisscars
      POSTGRES_PASSWORD: swisscars
      POSTGRES_DB: swisscars
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swisscars']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
